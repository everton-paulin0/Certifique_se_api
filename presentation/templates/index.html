<!-- presentation/templates/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Certificados & Lista Multi-tenant</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        textarea { width: 100%; height: 200px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Geração de PDFs e Certificados</h2>
    <label>ID do Tenant:</label><br>
    <input type="text" id="tenantId" value="empresa_a"><br><br>

    <label>Dados JSON (Lista de Alunos e Cursos):</label><br>
    <textarea id="jsonData">[
  {
    "student_name": "João Silva",
    "student_doc": "123.456.789-00",
    "instructor_name": "Maria Santos",
    "instructor_doc": "987.654.321-11",
    "course_name": "Python Clean Code",
    "duration": 40,
    "start_date": "2026-01-10",
    "end_date": "2026-01-20"
  }
]</textarea><br><br>

    <button onclick="gerarPDFs()">Gerar e Baixar ZIP</button>

    <script>
        async function gerarPDFs() {
            const tenantId = document.getElementById('tenantId').value;
            const items = JSON.parse(document.getElementById('jsonData').value);

            const response = await fetch('/api/generate-pdfs/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Tenant-ID': tenantId
                },
                body: JSON.stringify({ items: items })
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'certificados_e_lista.zip';
                a.click();
            } else {
                alert('Erro ao gerar os PDFs.');
            }
        }
    </script>
</body>
</html>
